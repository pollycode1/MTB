name: Build APK

# สร้าง APK ทุกครั้งที่ push แล้วอัปไว้ที่ GitHub Release (pre-release) ของ branch นั้น
# ลิงก์ดาวน์โหลด: https://github.com/<owner>/<repo>/releases/download/apk-<branch>/mtb.apk
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release key
        env:
          MTB_KEYSTORE: ${{ secrets.MTB_KEYSTORE }}
        run: |
          # ไม่มีกุญแจถาวร = ไม่สร้าง เพื่อไม่ให้ได้ APK ที่ติดตั้งทับแอพเดิมไม่ได้
          if [ -z "$MTB_KEYSTORE" ]; then echo "::error::ยังไม่ได้ตั้ง secret MTB_KEYSTORE"; exit 1; fi
          echo "$MTB_KEYSTORE" | base64 -d > "$RUNNER_TEMP/mtb.p12"
          echo "MTB_KEYSTORE_PATH=$RUNNER_TEMP/mtb.p12" >> "$GITHUB_ENV"
      - run: flutter build apk --release
        env:
          MTB_KEYSTORE_PASSWORD: ${{ secrets.MTB_KEYSTORE_PASSWORD }}
      - name: Tag name
        id: tag
        run: echo "tag=apk-$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - run: cp build/app/outputs/flutter-apk/app-release.apk mtb.apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" mtb.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK ${{ github.ref_name }}" --notes "สร้างจาก ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: mtb-apk
          path: mtb.apk
